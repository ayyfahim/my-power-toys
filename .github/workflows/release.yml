name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libwayland-dev libx11-dev libxext-dev libxtst-dev libxkbcommon-dev libgl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Update version in Cargo.toml
        run: sed -i 's/^version = ".*"/version = "${{ steps.version.outputs.VERSION }}"/' Cargo.toml

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Package release archive
        run: |
          mkdir -p dist
          BINARIES="mpt-daemon mpt-ctl mpt-settings mpt-app-launcher mpt-bulk-rename mpt-color-picker mpt-command-not-found mpt-command-palette mpt-crop-and-lock mpt-environment-variables mpt-fancy-zones mpt-file-locksmith mpt-hosts-editor mpt-image-resizer mpt-new-plus mpt-paste-plain mpt-peek mpt-power-display mpt-quick-accent mpt-screen-ruler mpt-shortcut-guide mpt-text-extractor mpt-workspaces mpt-zoom-it"
          for bin in $BINARIES; do
            cp "target/release/$bin" dist/
          done
          cp crates/key-manager/assets/99-mpt-uinput.rules dist/
          cp -r assets dist/assets
          rm -f dist/assets/*.desktop dist/assets/*.service dist/assets/main-screen-app.png
          tar czf "my-power-toys-${{ steps.version.outputs.VERSION }}-x86_64-unknown-linux-gnu.tar.gz" -C dist $BINARIES 99-mpt-uinput.rules assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: my-power-toys-*.tar.gz
