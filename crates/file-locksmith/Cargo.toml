[package]
name = "mpt-file-locksmith"
description = "Find and stop processes that are using a file or folder"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mpt-file-locksmith"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:egui", "dep:eframe", "dep:rfd", "dep:scopeguard", "mpt-common/gui"]

[dependencies]
mpt-common = { path = "../common" }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
libc = "0.2"
egui = { workspace = true, optional = true }
eframe = { workspace = true, optional = true }
rfd = { workspace = true, optional = true }
scopeguard = { version = "1", optional = true }
