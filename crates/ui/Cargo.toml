[package]
name = "mpt-ui"
description = "Settings UI for MyPowerToys (iced)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mpt-settings"
path = "src/main.rs"

[dependencies]
mpt-common = { path = "../common" }
mpt-awake = { path = "../awake", default-features = false }
mpt-always-on-top = { path = "../always-on-top", default-features = false }
mpt-key-manager = { path = "../key-manager", default-features = false }
mpt-workspaces = { path = "../workspaces", default-features = false }
mpt-hosts-editor = { path = "../hosts-editor", default-features = false }
mpt-bulk-rename = { path = "../bulk-rename", default-features = false }
mpt-mouse-utils = { path = "../mouse-utils", default-features = false }
mpt-app-launcher = { path = "../app-launcher", default-features = false }
mpt-fancy-zones = { path = "../fancy-zones", default-features = false }
mpt-color-picker = { path = "../color-picker", default-features = false }
mpt-text-extractor = { path = "../text-extractor", default-features = false }
mpt-image-resizer = { path = "../image-resizer", default-features = false }
mpt-peek = { path = "../peek", default-features = false }
mpt-light-switch = { path = "../light-switch", default-features = false }
mpt-command-palette = { path = "../command-palette", default-features = false }
mpt-paste-plain = { path = "../paste-plain", default-features = false }
mpt-screen-ruler = { path = "../screen-ruler", default-features = false }
mpt-crop-and-lock = { path = "../crop-and-lock", default-features = false }
mpt-file-locksmith = { path = "../file-locksmith", default-features = false }
mpt-environment-variables = { path = "../environment-variables", default-features = false }
mpt-new-plus = { path = "../new-plus", default-features = false }
mpt-zoom-it = { path = "../zoom-it", default-features = false }
mpt-power-display = { path = "../power-display", default-features = false }
mpt-grab-and-move = { path = "../grab-and-move", default-features = false }
mpt-alt-window-cycle = { path = "../alt-window-cycle", default-features = false }
mpt-command-not-found = { path = "../command-not-found", default-features = false }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
iced = { workspace = true }
iced_fonts = { version = "0.1", features = ["bootstrap"] }
zbus = { workspace = true }
tokio = { workspace = true }
rfd = { workspace = true }
rdev = "0.5"
