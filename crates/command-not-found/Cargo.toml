[package]
name = "mpt-command-not-found"
description = "Suggest packages that provide a missing shell command"
version.workspace = true
edition.workspace = true
license.workspace = true

# Plain CLI binary invoked by the shell hooks. Intentionally has no `gui`
# feature, so it is always built (also with `default-features = false`).
[[bin]]
name = "mpt-command-not-found"
path = "src/main.rs"

[dependencies]
mpt-common = { path = "../common" }
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
